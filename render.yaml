services:
  - type: web
    name: pycodecommenter-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --timeout 120
    healthCheckPath: /health
    envVars:
      - key: Gemini_api_keys
        sync: false
      - key: RATE_LIMIT
        value: "10 per minute"
      - key: MAX_DAILY_CALLS
        value: "200"
      - key: MAX_DAILY_CALLS_PER_USER
        value: "25"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
